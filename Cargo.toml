[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-timeline",
    "crates/forge-index",
    "crates/forge-daemon",
    "crates/forge-session",
    "crates/forge-git",
    "crates/tauri-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2.10", features = [] }
tauri-build = { version = "2.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"

forge-core = { path = "crates/forge-core" }
forge-timeline = { path = "crates/forge-timeline" }
forge-index = { path = "crates/forge-index" }
forge-daemon = { path = "crates/forge-daemon" }
forge-session = { path = "crates/forge-session" }
forge-git = { path = "crates/forge-git" }
